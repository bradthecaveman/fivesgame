<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Five hidden words. Slide the tiles to find them.">
<meta name="theme-color" content="#1C1C1C">
<title>FIVES — a 5×5 word puzzle</title>
<link rel="canonical" href="https://fivesgame.online/">

<!-- This page is indexable. The three supporting pages are not: unlock.html
     is reached from a receipt email, restore.html is a one-time hop, and the
     redirect left at the old address is a signpost rather than a
     destination. All three carry noindex.

     The title matches og:title on purpose, so the tab, the bookmark and the
     shared card all say the same thing. -->


<!-- Home-screen app. This is the whole reason for the meta block: an
     installed web app is exempt from Safari clearing site storage after
     seven unopened days, and a campaign with a key balance in it is far
     too expensive to lose that way. iOS has no install button, so the
     player has to use Share then Add to Home Screen. -->
<link rel="manifest" href="fives.webmanifest">
<link rel="apple-touch-icon" href="fives-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="fives-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FIVES">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Link preview. Without this, sending the URL to a tester shows a bare
     string and nothing else, which is a poor first impression of a game
     nobody has heard of. Regenerate the image with make-og.mjs.

     ⚠ og:image MUST be absolute. A relative path resolves against the
     scraper, not the site, and the card silently never appears.
     ⚠ This does NOT make Fives public — noindex above still stands, and
     the homepage still links to nothing. It only means that when YOU send
     the link, it looks like something. -->
<meta property="og:title" content="FIVES — a 5×5 word puzzle">
<meta property="og:description" content="Five hidden words. Slide the tiles to find them.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FIVES">
<meta property="og:url" content="https://fivesgame.online/">
<meta property="og:image" content="https://fivesgame.online/fives-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The FIVES board: a 5×5 grid of cream letter tiles with COMET spelled across the second row in lime.">
<meta name="twitter:card" content="summary_large_image">
<style>
  html,body{margin:0;padding:0;background:#1C1C1C;min-height:100%;}
  #root{min-height:100vh;}
</style>
</head>
<body>

${Gf}

.lk-root{
  --bg:#1C1C1C; --panel:#252525; --panel-2:#2E2E2E;
  --lime:#D8F55E; --lime-soft:#E7FA98; --tile-idle:#F0F5E1; --white:#FFFFFF;
  --ink:#15170F; --dark-tile:#191B14;
  --fg:#F2F3EE; --fg-dim:rgba(242,243,238,.52); --line:rgba(242,243,238,.14);
  --disp:'Asimovian', system-ui, sans-serif;
  --ui:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --tile:'Exo 2', system-ui, sans-serif;
  --r-tile:22%; --r-card:16px; --r-pill:999px;
  box-sizing:border-box; background:var(--bg);
  /* 100vh on iOS Safari is the height WITHOUT the toolbars, so the page runs
     under the address bar and the last footer line gets clipped. dvh tracks
     the chrome as it shows and hides. vh first as the fallback. */
  min-height:100vh; min-height:100dvh;
  color:var(--fg); font-family:var(--ui);
  display:flex; flex-direction:column; align-items:center;
  /* The viewport is viewport-fit=cover, so the page runs UNDER the status bar
     and the home indicator. In Safari that's invisible, because the browser's
     own chrome pushes everything down. Installed to the home screen there is
     no chrome, and without these insets the clock and battery sit on top of
     the back button. Reported from a real phone, 2026-08-02.

     The gap is a VARIABLE, not a literal, so a screen can ask for different
     headroom without having to restate env() and silently drop the inset.
     .lk-screen did exactly that and cost the picker and packs their insets. */
  --pad-top:16px;
  padding:calc(var(--pad-top) + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(22px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}

/* Standalone gets a little more headroom: the status bar is taller than the
   inset alone allows for once the wordmark is up against it. */
@media (display-mode: standalone){
  .lk-root{ --pad-top:24px; }
  .lk-screen{ --pad-top:22px; }
}

.lk-head{ text-align:center; margin-bottom:10px; position:relative; }
.lk-mark{
  font-family:var(--disp); font-weight:400; font-size:clamp(32px, 9.5vw, 44px);
  letter-spacing:.16em; margin-right:-.16em; color:var(--fg); line-height:1;
}
.lk-rule{ width:96px; height:7px; margin:8px auto 6px; border-radius:var(--r-pill); background:var(--lime); }
/* The theme name. Exo 2 rather than the body font, because everything else in
   the chrome \u2014 back button, stat plates, tick labels, tiles \u2014 is Exo 2, and
   system sans is for body copy. This label had simply never had a font set, so
   it fell through to the body font and read as a different typeface sitting
   next to "\u2190 Boards". Reported from a phone, 2026-08-05.

   It stays DIM here on purpose. The same class is the theme name on the result
   card, immediately above BOARD CLEARED, and lime in both places stacks two
   lime lines and takes the punch off the payoff. The board's top bar asks for
   lime on its own, below. */
.lk-eyebrow{
  font-family:var(--tile); font-weight:600; font-size:11px; letter-spacing:.26em;
  color:var(--fg-dim); text-transform:uppercase;
}
/* On a board the theme name is the only clue there is, so it earns the accent
   instead of sitting at the same weight as the way out. Board top bar only \u2014
   see the note above about the result card. */
.lk-topbar .lk-eyebrow{ color:var(--lime); }

.lk-ticks{ display:flex; gap:12px; margin:2px 0 5px; }
.lk-tick{
  display:flex; flex-direction:column; align-items:center; gap:5px; min-width:52px;
  background:none; border:none; padding:2px 0; font:inherit; color:inherit;
  -webkit-tap-highlight-color:transparent;
}
/* a word you can spend a hint on. Subtle on purpose: the button below is
   still the obvious route, this is the shortcut once you know it's there. */
.lk-tick.aim{ cursor:pointer; }
.lk-tick.aim .lk-tickmark{ border-color:rgba(216,245,94,.45); border-style:dashed; }
.lk-tick.aim:hover .lk-tickmark{ border-color:var(--lime); background:rgba(216,245,94,.12); }
.lk-tick.aim:active .lk-tickmark{ transform:scale(.93); }
.lk-tick:disabled{ cursor:default; }
.lk-tick:focus-visible .lk-tickmark{ outline:2.5px solid var(--lime); outline-offset:3px; }
.lk-tickmark{
  width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  font-size:13px; color:var(--ink); transition:background .3s, border-color .3s, transform .3s;
}
.lk-tickmark.got{ background:var(--lime); border-color:var(--lime); transform:scale(1.06); }
.lk-tickinfo{ font-family:var(--ui); font-size:10px; color:var(--fg-dim); min-height:13px; letter-spacing:.08em; }
/* revealed letters read as given-to-you, not guessed */
.lk-tickinfo.mask{ font-family:var(--tile); font-weight:700; font-size:11.5px; color:var(--lime); letter-spacing:.12em; }

.lk-hint{ font-size:13px; color:var(--fg-dim); max-width:370px; text-align:center; line-height:1.5; margin:0 0 10px; }

.lk-frame{
  position:relative; padding:8px; border:2px solid var(--lime); border-radius:22px;
}
.lk-toast{
  position:absolute; top:-12px; left:50%; transform:translate(-50%,-100%);
  white-space:nowrap; padding:8px 16px; border-radius:var(--r-pill);
  font-family:var(--ui); font-weight:600; font-size:12px; letter-spacing:.04em;
  animation:lk-toastin .25s ease; z-index:5;
}
.lk-toast.hit{ background:var(--lime); color:var(--ink); }
.lk-toast.dim{ background:var(--panel-2); color:var(--fg); }
@keyframes lk-toastin{ from{ opacity:0; transform:translate(-50%,-80%);} to{ opacity:1; transform:translate(-50%,-100%);} }

.lk-board{
  /* the board owns vertical drags so a swipe doesn't scroll the page under it */
  touch-action:none;
  position:relative; width:min(90vw - 20px, 380px); aspect-ratio:1/1;
  background:transparent;
}
.lk-slot{
  position:absolute; top:0; left:0; width:20%; height:20%;
  background:none; border:none; padding:0; cursor:pointer;
  transition:transform .16s cubic-bezier(.2,.7,.3,1);
  -webkit-tap-highlight-color:transparent;
}
.lk-slot:focus-visible .lk-placard{ outline:2.5px solid var(--lime); outline-offset:3px; }
.lk-placard{
  position:absolute; inset:2px; border-radius:var(--r-tile);
  background:var(--tile-idle); color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--tile); font-weight:700; font-size:clamp(19px, 5.9vw, 28px);
  transition:background .28s, color .28s, box-shadow .28s, transform .28s;
  user-select:none;
}
.lk-placard.glow{
  background:var(--dark-tile); color:var(--lime);
}
.lk-placard.found{
  background:var(--lime); color:var(--ink);
  animation:lk-pop .32s ease;
}
@keyframes lk-pop{ 40%{ transform:scale(1.07);} 100%{ transform:scale(1);} }

/* board cleared: the tiles fall out of the frame and the result card comes up
   into the empty space. The slot is what's positioned on the grid, so the
   placard inside it is free to be thrown about without disturbing the layout. */
.lk-placard.tumble{
  animation:lk-tumble var(--dur, .9s) cubic-bezier(.5,.02,.9,.36) forwards;
  will-change:transform, opacity;
}
@keyframes lk-tumble{
  0%   { transform:translate(0,0) rotate(0deg); opacity:1; }
  /* small lift before the drop, which is what makes it read as gravity
     rather than as tiles sliding off a table */
  12%  { transform:translate(calc(var(--drift) * .1), -9%) rotate(calc(var(--spin) * .18)); opacity:1; }
  100% { transform:translate(var(--drift), 115vh) rotate(var(--spin)); opacity:.9; }
}
/* the empty slot goes with them rather than sitting there on its own */
.lk-board.tumble .lk-holecup{ opacity:0; transition:opacity .25s; }

@media (prefers-reduced-motion: reduce){
  .lk-placard.tumble{ animation:none; opacity:0; transition:opacity .25s; }
}

/* empty cell */
.lk-holecup{
  position:absolute; top:0; left:0; width:20%; height:20%;
  display:flex; align-items:center; justify-content:center;
  transition:transform .16s cubic-bezier(.2,.7,.3,1); pointer-events:none;
}
.lk-holecup span{
  width:calc(100% - 4px); height:calc(100% - 4px); border-radius:var(--r-tile);
  background:rgba(242,243,238,.035);
  box-shadow: inset 0 0 0 1.5px rgba(242,243,238,.09);
}

.lk-strip{ display:flex; gap:6px; margin-top:13px; width:min(90vw, 400px); }
.lk-plate{
  border:none; border-radius:var(--r-card); padding:11px 6px 12px;
  flex:1 1 0; min-width:0; text-align:center; background:var(--panel);
}
.lk-plate label{
  display:block; font-size:9px; letter-spacing:.10em; text-transform:uppercase;
  color:var(--fg-dim); margin-bottom:6px; line-height:1.25; min-height:2.5em; white-space:normal;
}
.lk-plate strong{ font-family:var(--tile); font-size:22px; font-weight:600; color:var(--fg); }
.lk-of{ font-size:13px; color:var(--fg-dim); }

.lk-actions{ display:flex; gap:10px; margin-top:13px; flex-wrap:wrap; justify-content:center; }
.lk-btn{
  font-family:var(--tile); font-size:12px; font-weight:600; letter-spacing:.10em; text-transform:uppercase;
  color:var(--fg); background:var(--panel); border:none; border-radius:var(--r-pill);
  padding:12px 20px; cursor:pointer; transition:background .2s, opacity .2s, transform .12s;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
}
.lk-btn:disabled{ opacity:.35; cursor:default; }
.lk-btn:hover:not(:disabled){ background:var(--panel-2); }
.lk-btn:active:not(:disabled){ transform:translateY(1px); }
.lk-btn:focus-visible{ outline:2.5px solid var(--lime); outline-offset:2px; }
.lk-btn.primary{ background:var(--lime); color:var(--ink); }
.lk-btn.primary:hover:not(:disabled){ background:var(--lime-soft); }
/* a dimmed lime button on a lime background is unreadable, so an
   unaffordable price drops out of the primary style altogether */
.lk-btn.primary:disabled{ background:var(--panel-2); color:var(--fg-dim); opacity:1; }
.lk-btn:disabled .lk-gem{ opacity:.3; }

.lk-spotted{ margin-top:16px; font-size:11.5px; letter-spacing:.04em; color:var(--fg-dim); max-width:370px; text-align:center; line-height:1.6; }

.lk-scrim{
  position:fixed; inset:0; background:rgba(12,12,12,.82); backdrop-filter:blur(4px);
  display:flex; justify-content:center; z-index:50;
  animation:lk-fade .25s ease; overflow:auto;
  /* Sits high rather than centred, roughly where the board was, so the card
     arrives in the space the tiles just left instead of floating detached in
     the middle of the screen. Clamped so it can't ride up under the notch on
     a short screen or sag too far down on a tall one. */
  align-items:flex-start;
  /* ~185px is where the board frame actually starts, and the stuff above it is
     fixed-height, so that top edge barely moves with viewport. The vh term only
     does the work on short screens, where the card has to come up to fit. */
  padding:calc(clamp(70px, 20vh, 185px) + env(safe-area-inset-top)) 20px
          calc(24px + env(safe-area-inset-bottom));
}
@keyframes lk-fade{ from{opacity:0} to{opacity:1} }
.lk-cardpanel{
  background:var(--panel); border-radius:22px;
  box-shadow: 0 24px 60px rgba(0,0,0,.55);
  padding:32px 28px 28px; text-align:center; max-width:340px; width:100%;
  animation:lk-rise .3s cubic-bezier(.2,.7,.3,1);
}
@keyframes lk-rise{ from{ transform:translateY(14px); opacity:0 } to{ transform:none; opacity:1 } }
.lk-term{ font-family:var(--disp); font-size:22px; color:var(--lime); margin:12px 0 18px; letter-spacing:.06em; }

.lk-marks{ display:flex; gap:7px; justify-content:center; margin-bottom:20px; }
.lk-mk{ width:26px; height:26px; border-radius:7px; display:inline-block; }
.lk-mk.clean{ background:var(--lime); }
.lk-mk.hinted{ background:transparent; box-shadow:inset 0 0 0 2px var(--lime); }

.lk-facts{
  list-style:none; margin:0 0 18px; padding:0;
  font-family:var(--tile); font-size:15px; line-height:2; color:var(--fg);
}
.lk-facts b{ font-weight:700; color:var(--lime); }
.lk-words{
  font-family:var(--tile); font-size:12px; font-weight:600; letter-spacing:.10em;
  text-transform:uppercase; color:var(--fg-dim); margin-bottom:8px;
}
.lk-sub{ font-size:12px; color:var(--fg-dim); margin-bottom:22px; line-height:1.6; }
.lk-cardactions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

.lk-foot{ margin-top:13px; font-size:11px; letter-spacing:.06em; color:rgba(242,243,238,.34); text-align:center; line-height:1.75; }

/* Add to Home Screen. Quiet on purpose \u2014 the picker's job is to lay the
   boards out in front of you, and this must not compete with them. No lime,
   no panel fill, no icon: a hairline box in the footer's own dim grey, the
   same weight as the Ko-fi line it sits above. It is a note, not a banner,
   and it never appears on a board. */
.lk-install{
  display:flex; align-items:flex-start; gap:8px;
  width:min(90vw - 20px, 380px); margin:2px auto 0;
  padding:10px 6px 10px 12px; border-radius:14px;
  border:1px solid rgba(242,243,238,.10); text-align:left;
}
.lk-install p{
  margin:0; flex:1 1 auto; font-size:11px; line-height:1.65;
  letter-spacing:.02em; color:rgba(242,243,238,.42);
}
.lk-install b{ color:rgba(242,243,238,.66); font-weight:600; }
.lk-install button{
  flex:0 0 auto; background:none; border:none; cursor:pointer;
  color:rgba(242,243,238,.34); font-size:15px; line-height:1;
  padding:2px 8px; border-radius:50%;
}
.lk-install button:hover{ color:var(--fg); }
.lk-install button:focus-visible{ outline:2px solid var(--lime); outline-offset:1px; }

/* The way in for anyone arriving from roninpuzzles.com. Same weight as the
   Ko-fi line on purpose: it is a footnote, not an announcement, and the
   people who need it are looking for it. It renders only while this app has
   nothing saved. */
.lk-moved{ margin-top:10px; }
.lk-moved a{ color:rgba(242,243,238,.42); text-decoration:underline; text-underline-offset:3px; transition:color .2s; }
.lk-moved a:hover{ color:var(--lime); }
.lk-moved a:focus-visible{ outline:2px solid var(--lime); outline-offset:3px; border-radius:3px; }
.lk-kofi{ margin-top:10px; }
.lk-kofi a{ color:rgba(242,243,238,.42); text-decoration:underline; text-underline-offset:3px; transition:color .2s; }
.lk-kofi a:hover{ color:var(--lime); }
.lk-kofi a:focus-visible{ outline:2px solid var(--lime); outline-offset:3px; border-radius:3px; }

/* ============ campaign ============ */

.lk-gem{ width:14px; height:14px; flex:0 0 auto; }
.lk-gem.off{ opacity:.22; }

/* Sets the variable, NOT padding-top. Overriding the padding here would drop
   the safe-area inset that .lk-root's shorthand carries. */
.lk-screen{ --pad-top:14px; }
.lk-topbar{
  width:min(90vw - 20px, 380px); display:flex; align-items:center;
  justify-content:space-between; gap:12px; margin-bottom:11px;
}
.lk-mark.sm{ font-size:26px; }
.lk-purse{
  display:inline-flex; align-items:center; gap:7px; background:var(--panel);
  border-radius:var(--r-pill); padding:7px 13px 7px 10px;
}
.lk-purse span{ font-family:var(--tile); font-weight:700; font-size:14px; color:var(--lime); letter-spacing:.03em; }
.lk-purse small{
  font-family:var(--tile); font-weight:600; font-size:9.5px; letter-spacing:.16em;
  color:var(--fg-dim); text-transform:uppercase;
}
.lk-back{
  font-family:var(--tile); font-size:11px; font-weight:600; letter-spacing:.12em;
  text-transform:uppercase; color:var(--fg-dim); background:none; border:none;
  padding:8px 2px; cursor:pointer;
}
.lk-back:hover{ color:var(--lime); }
/* Lime, to balance the accent at the other end of the bar \u2014 the theme name on
   a board, the key count on the packs screen. Brad's call, 2026-08-05, with
   the caveat that it comes back out if it reads as too much in the hand. */
.lk-arrow{ color:var(--lime); }

.lk-tabs{ width:min(90vw - 20px, 380px); display:flex; gap:6px; margin-bottom:10px; }
.lk-tab{
  font-family:var(--tile); font-size:10.5px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--fg-dim); background:var(--panel);
  border:none; border-radius:var(--r-pill); padding:9px 14px; cursor:pointer;
}
.lk-tab.on{ background:var(--lime); color:var(--ink); }
.lk-tab{ display:inline-flex; align-items:center; gap:6px; }
.lk-lockdot{
  width:5px; height:5px; border-radius:50%; background:currentColor; opacity:.5;
}

.lk-packline{
  width:min(90vw - 20px, 380px); display:flex; justify-content:space-between;
  align-items:baseline; margin:0 0 9px;
}
.lk-packline.foot{ margin:16px 0 0; }
.lk-packnm{
  font-family:var(--tile); font-weight:700; font-size:12px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--fg);
}
.lk-packprog{ font-family:var(--tile); font-size:11.5px; color:var(--fg-dim); letter-spacing:.06em; }
/* Sharing the pack. The auto margin rather than a changed justify-content,
   because .lk-packline.foot uses the same rule with a different pair of
   children and space-between is right for that one. */
.lk-packnm{ margin-right:auto; }
.lk-packline{ gap:9px; }
/* Deliberately quiet furniture. The grid below is the loud thing on this
   screen and a lime button up here would compete with it \u2014 same reasoning
   as the install note.

   \u26A0 The negative margins are load-bearing twice over. They buy a 41x37 tap
   target out of a 17px icon, which a finger needs and the icon must not grow
   to, AND because margin-right cancels padding-right exactly, the icon's
   right edge lands on the last tile column rather than 12px past it.
   Measured: 0.01px out. Change one of the pair and change the other. */
.lk-share{
  align-self:center; margin:-10px -12px -10px 0; padding:10px 12px;
  background:none; border:none; cursor:pointer; color:var(--fg-dim);
  display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.lk-share:hover:not(:disabled){ color:var(--lime); }
.lk-share:focus-visible{ outline:2px solid var(--lime); outline-offset:1px; border-radius:7px; }
.lk-share.busy{ opacity:.4; cursor:default; }
.lk-shareico{
  display:block; width:17px; height:17px; fill:none; stroke:currentColor;
  stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;
}
/* Only ever holds something the player needs told: that it copied or saved
   instead of sharing. Silent on success, because they watched it happen. */
.lk-sharenote{
  width:min(90vw - 20px, 380px); margin:-3px 0 7px;
  font-family:var(--tile); font-size:11px; color:var(--fg-dim); letter-spacing:.04em;
}
.lk-link{
  font-family:var(--tile); font-weight:700; font-size:12px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--lime); background:none; border:none;
  padding:0; cursor:pointer;
}

/* the picker grid \u2014 the game's own 5x5 */
.lk-grid{
  width:min(90vw - 20px, 380px); display:grid; grid-template-columns:repeat(5,1fr);
  gap:4px; padding:8px; border:2px solid var(--lime); border-radius:22px;
}
.lk-tile{
  position:relative; aspect-ratio:1/1; border-radius:var(--r-tile);
  background:var(--tile-idle); color:var(--ink); overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  border:none; padding:0; cursor:pointer; font-family:var(--tile);
  transition:background .25s, color .25s, transform .12s;
  -webkit-tap-highlight-color:transparent;
}
.lk-tile:active{ transform:scale(.97); }
.lk-tile:focus-visible{ outline:2.5px solid var(--lime); outline-offset:3px; }
/* \u26A0 The 3px was 5px until 2026-08-06, and the 2px it gives back is not
   cosmetic. Measured in a browser at real phone widths: at 390px a tile is
   63.0px with 53.0px of room, and CHRISTMAS is 53px of text, so it fit by
   0.2px. At 375px \u2014 SE, 12 mini, 13 mini \u2014 the tile is 60.3px with 50.3px of
   room and CHRISTMAS was CLIPPED by 2.5px, COUNTRIES by 0.8px. The tile has
   overflow:hidden, so it read as slightly wrong rather than obviously broken,
   and it was live. 3px gives 54.3px and clears both.

   Every other name in the library measures under 47px, so these two are the
   whole problem rather than a sample. Check any new theme against 50px. */
.lk-tilenm{
  font-size:9.5px; font-weight:700; text-transform:uppercase; line-height:1.15;
  text-align:center; padding:0 3px; max-width:100%;
}
/* cleared. The keyline isn't on the game board \u2014 there a dark tile sits
   among cream ones, but in a grid where most tiles end up dark, flat
   #191B14 reads as a missing tile rather than a cleared one. */
.lk-tile.done{
  background:var(--dark-tile); color:var(--lime);
  box-shadow:inset 0 0 0 1.5px rgba(216,245,94,.30);
}
/* all three keys taken \u2014 the board's own "claimed word" state */
.lk-tile.perfect{ background:var(--lime); color:var(--ink); }
.lk-tile.locked{ background:rgba(240,245,225,.10); color:rgba(242,243,238,.34); cursor:pointer; }
.lk-tile.sel{ box-shadow:inset 0 0 0 2px var(--lime); }

.lk-pips{ position:absolute; bottom:4px; left:0; right:0; display:flex; justify-content:center; gap:3px; }
.lk-pip{ width:4.5px; height:4.5px; border-radius:50%; box-shadow:inset 0 0 0 1px currentColor; opacity:.45; }
.lk-pip.got{ background:currentColor; opacity:1; box-shadow:none; }
/* \u26A0 This was 3px of LIME until 2026-08-17, and the height was the smaller
   half of the problem. The bar only ever appears on an in-progress tile,
   which is --tile-idle cream, and lime on that cream measures 1.1:1. It
   was not dim, it was invisible, and a taller lime bar would have been a
   bigger invisible thing. --dark-tile measures 15.6:1 and is already in
   the palette, so no new colour enters the game.

   It also reads correctly: a cleared tile goes dark, so a bar filling with
   dark is the tile turning into a finished tile. The picker already speaks
   that language.

   \u26A0 It is INSET now, and full-bleed was tried first and looked broken.
   Measured magnified in a browser: a dark bar pinned to left:0 bottom:0 gets
   clipped by the tile's own 22% corner, and since the bar is within 3 shades
   of the page behind it, the clipped corner merges with the background. It
   read as a chunk bitten out of the tile rather than as progress. Inset
   inside the cream, with the tile's radius nowhere near it, it reads as a
   bar. Don't move it back to the edges.

   The faint track matters as much as the fill: it shows how far there is to
   go, so 1 of 5 words reads as "started" instead of as a small mark. Sizing
   the fill against the track also keeps the percentage honest, which it was
   not when a % of the whole tile was drawn from inside a rounded corner.

   Room on the smallest phone, at 375px where a tile is 60.3px: 13.7px of
   clear space between the bottom of the theme name and the top of the track.
   The pips sit in roughly the same place, but no tile ever shows both \u2014 pips
   are cleared-only and the bar is in-progress-only.

   \u26A0 No backticks anywhere in this stylesheet. The whole thing is one JS
   template literal, so a single backtick ends it. Cost a failed build. */
.lk-bartrack{
  position:absolute; left:8px; right:8px; bottom:5px; height:5px;
  border-radius:var(--r-pill); background:rgba(21,23,15,.16); overflow:hidden;
}
.lk-bar{ display:block; height:100%; border-radius:var(--r-pill); background:var(--ink); }

.lk-resume, .lk-offer{
  width:min(90vw - 20px, 380px); margin-top:16px; background:var(--panel);
  border-radius:20px; padding:14px 15px; display:flex; align-items:center;
  gap:13px; text-align:left; border:none; cursor:pointer;
}
.lk-offer{ cursor:default; }
.lk-resumetxt, .lk-offertxt{ flex:1 1 auto; min-width:0; }
.lk-resume b, .lk-offer b{
  display:block; font-family:var(--tile); font-weight:700; font-size:13.5px;
  letter-spacing:.04em; color:var(--fg);
}
.lk-resume small, .lk-offer small{ font-size:11.5px; color:var(--fg-dim); }
.lk-go{
  font-family:var(--tile); font-weight:700; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink); background:var(--lime);
  padding:8px 13px; border-radius:var(--r-pill); white-space:nowrap;
}

/* result card \u2014 keys earned */
.lk-earn{ border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:4px 0; margin-bottom:18px; }
.lk-earnrow{ display:flex; align-items:center; gap:11px; padding:10px 2px; }
.lk-earnrow + .lk-earnrow{ border-top:1px solid rgba(242,243,238,.07); }
.lk-earnrow .lk-gem{ width:19px; height:19px; }
.lk-earntxt{ text-align:left; flex:1 1 auto; }
.lk-earntxt b{ display:block; font-family:var(--tile); font-size:12.5px; font-weight:700; letter-spacing:.03em; }
.lk-earntxt small{ font-size:11px; color:var(--fg-dim); }
.lk-earnrow.off .lk-earntxt b{ color:var(--fg-dim); }
.lk-earnval{ font-family:var(--tile); font-weight:700; font-size:13px; color:var(--lime); letter-spacing:.04em; }
.lk-earnrow.off .lk-earnval{ color:var(--fg-dim); opacity:.5; }
.lk-total{
  display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:20px;
  font-family:var(--tile); font-size:13px; font-weight:600; letter-spacing:.06em; color:var(--fg);
}
.lk-total .lk-gem{ width:15px; height:15px; }
.lk-total b{ color:var(--lime); font-size:15px; }

/* packs screen */
.lk-sheet{ width:min(90vw - 20px, 380px); }
.lk-pack{
  background:var(--panel); border-radius:20px; padding:15px 16px 16px;
  margin-bottom:12px; border:1px solid transparent;
}
.lk-pack.owned{ border-color:rgba(216,245,94,.28); }
.lk-packtop{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; }
.lk-packname{ font-family:var(--tile); font-weight:700; font-size:15px; letter-spacing:.04em; }
.lk-packmeta{ font-size:11.5px; color:var(--fg-dim); margin-top:3px; line-height:1.45; }
.lk-tag{
  font-family:var(--tile); font-size:9.5px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; padding:5px 9px; border-radius:var(--r-pill);
  background:var(--lime); color:var(--ink); white-space:nowrap;
}
.lk-tag.dim{ background:var(--panel-2); color:var(--fg-dim); }
.lk-mini{ display:grid; grid-template-columns:repeat(5,1fr); gap:3px; width:126px; margin:12px 0 14px; }
.lk-mini i{ aspect-ratio:1/1; border-radius:26%; background:rgba(240,245,225,.12); }
.lk-mini i.on{ background:var(--lime); }
.lk-mini i.part{ background:var(--dark-tile); box-shadow:inset 0 0 0 1px rgba(216,245,94,.5); }
.lk-buys{ display:flex; gap:8px; }
.lk-buys .lk-btn{ flex:1 1 0; padding:11px 8px; font-size:11px; letter-spacing:.06em; }
/* The money option is an <a>, because it leaves the app. A button implies
   something happens here; a link tells the truth about where you are going. */
.lk-buys a.lk-btn{ display:flex; align-items:center; justify-content:center; text-decoration:none; }
.lk-btn.alt{ background:var(--panel-2); color:var(--fg); }
.lk-btn.wide{ width:100%; margin-top:8px; }
.lk-short{ font-size:11.5px; color:var(--fg-dim); text-align:center; margin:10px 0 0; line-height:1.5; }
.lk-short b{ color:var(--lime); font-weight:600; }

/* A locked pack shows its themes as tiles, in the picker's own language, so
   the thing you are being asked to buy looks like the thing you will play.

   \u26A0 It has to bleed to the card's edge. Inside the card's 16px padding the
   grid gets 299px on a 390px phone and tiles come out 52.8px against the
   picker's 63px, which the long names do not survive. Full width gives
   59.2px, and 9px names with 3px padding leave 53.2px of room against
   CHRISTMAS's 50px \u2014 clear at 390 and at 375. Do not reuse the picker's
   9.5px here; it does not fit. */
.lk-packgrid{
  box-sizing:border-box; width:calc(100% + 32px); margin:12px -16px 13px;
  display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:4px;
  padding:8px; border:1.5px solid rgba(216,245,94,.28); border-radius:20px;
}
.lk-packtile{
  aspect-ratio:1/1; border-radius:var(--r-tile); overflow:hidden;
  background:rgba(240,245,225,.10); color:rgba(242,243,238,.34);
  display:flex; align-items:center; justify-content:center;
}
.lk-packtile span{
  font-family:var(--tile); font-size:9px; font-weight:700; text-transform:uppercase;
  line-height:1.15; text-align:center; padding:0 3px; max-width:100%;
}

/* ---------- redeeming ----------
   Always visible rather than hidden behind a link. The person who needs it is
   coming back from an email on a train, and hunting for it is where they are
   lost. See the note in picker.jsx about why the clipboard is the only thing
   that crosses from a browser to an installed app. */
.lk-redeem{
  background:var(--panel); border-radius:20px; padding:14px 16px 15px; margin-bottom:12px;
}
.lk-backfrom{
  margin:0 0 11px; font-family:var(--tile); font-size:12.5px; font-weight:600;
  color:var(--lime); line-height:1.45;
}
.lk-redeemlbl{
  font-family:var(--tile); font-size:11px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--fg-dim); margin-bottom:9px;
}
.lk-redeemrow{ display:flex; gap:8px; }
.lk-redeemrow .lk-btn{ flex:0 0 auto; padding:10px 15px; font-size:11px; }
/* \u26A0 16px is NOT a taste decision and must not be tuned down to match the
   other small type. iOS Safari zooms the whole page whenever you focus an
   input under 16px, and there is no way to opt out that doesn't also break
   pinch-zoom for everyone. Reported from a phone 2026-08-07: at 12.5px,
   tapping the field zoomed the page and pushed the Paste button off the
   right edge, so the one control that makes this flow bearable became
   unreachable at the exact moment it was needed.

   The letter-spacing stays, because a code is read character by character.
   Measured: at 375px the field holds the whole code in 137px of its 180px.
   At 320px \u2014 a 2016 phone \u2014 it scrolls inside the field by 7px, which is
   ordinary input behaviour rather than a break, and not worth a media query. */
.lk-codein{
  flex:1 1 0; min-width:0; background:var(--bg); color:var(--fg);
  border:1px solid var(--line); border-radius:var(--r-pill); padding:10px 14px;
  font-family:var(--tile); font-size:16px; font-weight:600; letter-spacing:.08em;
}
.lk-codein::placeholder{ color:rgba(242,243,238,.28); }
.lk-codein:focus{ outline:none; border-color:var(--lime); }
/* Sits in the sheet, not inside the redeem panel, because redeeming the last
   locked pack removes that panel and would take the confirmation with it. */
.lk-saidit{
  margin:2px 0 12px; font-size:12.5px; font-weight:600; line-height:1.5;
  text-align:center; color:var(--lime);
}
.lk-saidit.bad{ color:var(--fg-dim); font-weight:400; }
.lk-redeem + .lk-saidit{ margin-top:-4px; }

/* ---------- the testing way back ----------
   Long-pressing the wordmark re-locks paid packs. The wordmark must refuse
   iOS's text selection and its long-press callout, or the gesture fights the
   browser and reads as a bug rather than as a hold. */
.lk-mark{
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
.lk-relock{
  width:min(90vw - 20px, 380px); background:var(--panel); border-radius:18px;
  padding:14px 16px 15px; margin-bottom:14px;
}
.lk-relock p{
  margin:0 0 12px; font-size:12.5px; line-height:1.5; color:var(--fg-dim); text-align:center;
}
.lk-relockrow{ display:flex; gap:8px; }
.lk-relockrow .lk-btn{ flex:1 1 0; padding:11px 8px; font-size:11px; letter-spacing:.06em; }
.lk-note{
  width:min(90vw - 20px, 380px); font-size:11.5px; color:var(--fg-dim);
  text-align:center; line-height:1.6; margin-top:4px;
}

@media (prefers-reduced-motion: reduce){
  .lk-root *{ transition:none !important; animation:none !important; }
}

     site that is nothing but Fives. When Fives lived at
     roninpuzzles.com/fives.html this line needed an explicit scope to keep
     the worker off Ronin, and one careless edit would have handed it the
     whole site. Ronin is now on a different origin entirely, so there is no
     line to get wrong. See STATUS.

if ("serviceWorker" in navigator) {
  addEventListener("load", function () {
    navigator.serviceWorker.register("./fives-sw.js").catch(function () {});
