<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1C1C1C">
<title>Bringing your Fives progress over</title>
<style>
  :root{
    --bg:#1C1C1C; --panel:#252525; --panel-2:#2E2E2E; --lime:#D8F55E; --lime-soft:#E7FA98;
    --ink:#15170F; --fg:#F2F3EE; --fg-dim:rgba(242,243,238,.52); --line:rgba(242,243,238,.14);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); min-height:100%; }
  body{
    color:var(--fg); line-height:1.5;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; justify-content:center;
    padding:calc(40px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  .wrap{ width:100%; max-width:380px; text-align:center; }
  .mark{ font-size:30px; font-weight:800; letter-spacing:.16em; margin-right:-.16em; line-height:1; }
  .rule{ width:96px; height:7px; margin:12px auto 26px; border-radius:999px; background:var(--lime); }
  h1{ font-size:19px; font-weight:600; letter-spacing:.02em; margin:0 0 10px; }
  p{ font-size:14px; color:var(--fg-dim); margin:0 0 16px; }
  p.keep{ color:var(--fg); }
  a.go{
    display:block; margin-top:22px; padding:14px 16px; border-radius:999px;
    background:var(--lime); color:var(--ink); text-decoration:none;
    font-size:12px; font-weight:800; letter-spacing:.10em; text-transform:uppercase;
  }
  a.go:hover{ background:var(--lime-soft); }
  a.go.quiet{ background:var(--panel); color:var(--fg); }
  a.go.quiet:hover{ background:var(--panel-2); }
  .foot{ margin-top:26px; border-top:1px solid var(--line); padding-top:18px; }
  .foot p{ font-size:12.5px; margin:0; }
  code{ color:var(--lime); font-size:13px; word-break:break-all; }

  button{
    width:100%; margin-top:16px; font-family:inherit; font-size:12px; font-weight:800;
    letter-spacing:.10em; text-transform:uppercase; color:var(--ink); background:var(--lime);
    border:none; border-radius:999px; padding:14px 16px; cursor:pointer;
  }
  button:hover{ background:var(--lime-soft); }
  button:active{ transform:translateY(1px); }
  button.quiet{ background:var(--panel); color:var(--fg); }
  button.done{ background:var(--panel); color:var(--fg); }

  ol{ margin:24px 0 0; padding:0; list-style:none; counter-reset:s; text-align:left; }
  ol li{
    counter-increment:s; position:relative; padding:0 0 0 34px; margin-bottom:13px;
    font-size:14px; color:var(--fg);
  }
  ol li::before{
    content:counter(s); position:absolute; left:0; top:1px;
    width:22px; height:22px; border-radius:50%; background:var(--panel); color:var(--lime);
    font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  /* A thousand characters of base64 that nobody should have to look at, but
     a button that cannot work must still leave a way through.

     ⚠ 16px IS NOT A STYLE CHOICE AND MUST NOT BE REDUCED. iOS zooms the
     whole page when you focus any field with text under 16px, which throws
     the layout about and puts the buttons off screen. The unlock code field
     learned this in July and was bumped from 13px for the same reason. This
     box shipped at 11px and did it again on Brad's phone on 2026-08-08.
     Small text here is not worth a zoom. */
  textarea{
    width:100%; margin-top:14px; height:96px; resize:none;
    background:var(--panel); color:var(--fg-dim); border:1px solid var(--line);
    border-radius:14px; padding:12px; font-size:16px; line-height:1.35;
    font-family:ui-monospace,monospace; word-break:break-all;
  }
  textarea:focus{ outline:2px solid var(--lime); outline-offset:2px; }
  .hide{ display:none; }</style>
</head>
<body>
<div class="wrap">
  <div class="mark">FIVES</div>
  <div class="rule"></div>
  <h1 id="head">Bringing your progress over</h1>
  <p id="sub">One moment.</p>

  <!-- ⚠ THE BOX IS VISIBLE FROM THE START, not revealed when the button
       fails. Hiding it meant that on iOS, where the clipboard read is
       refused more often than not, the first tap did nothing useful and
       then a box appeared and grabbed focus. Two surprises and a zoom.
       Showing both means whichever route works for you is already in front
       of you, and the button is a shortcut rather than a gate. -->
  <div id="pastebox" class="hide">
    <button id="paste">Paste my progress</button>
    <textarea id="blob" placeholder="or paste it in here"
      aria-label="Your progress"
      autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"></textarea>
    <button id="use" class="quiet hide">Use this</button>
  </div>

  <a class="go" id="go" href="./">Play</a>
</div>
<script>
(function () {

  function b64(bytes) {
    var s = "", CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    }
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function unb64(str) {
    var s = str.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function pack(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (typeof CompressionStream === "function") {
      try {
        var cs = new CompressionStream("gzip");
        var buf = await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer();
        return "z1." + b64(new Uint8Array(buf));
      } catch (e) { /* fall through to plain */ }
    }
    return "s1." + b64(bytes);
  }
  async function unpack(str) {
    var at = str.indexOf(".");
    if (at < 0) throw new Error("no marker");
    var kind = str.slice(0, at), bytes = unb64(str.slice(at + 1));
    if (kind === "z1") {
      var ds = new DecompressionStream("gzip");
      var buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
      return JSON.parse(new TextDecoder().decode(buf));
    }
    if (kind !== "s1") throw new Error("unknown marker");
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  var head = document.getElementById("head");
  var sub = document.getElementById("sub");

  function done(msg, wait) {
    head.textContent = "Ready";
    sub.textContent = msg;
    setTimeout(function () { location.replace("./"); }, wait);
  }

  /* ⚠ NEVER OVERWRITE PROGRESS THAT IS ALREADY HERE. Somebody who has
     played on the new address and then pastes an old copy a month later
     would otherwise have a month replaced by a stale one. This page only
     ever opens onto an empty room. */
  function alreadyPlaying() {
    try {
      var c = JSON.parse(localStorage.getItem("fives.campaign.v1") || "null");
      if (c) {
        if (Number(c.keys) > 0) return true;
        if (c.boards && Object.keys(c.boards).length) return true;
        if (c.unlocked && c.unlocked.length) return true;
        if (c.owned && c.owned.some(function (o) { return o !== "base"; })) return true;
      }
      var p = JSON.parse(localStorage.getItem("fives.play.v2") || "null");
      if (p && p.boards && Object.keys(p.boards).length) return true;
    } catch (e) { /* storage blocked: treat as empty and try */ }
    return false;
  }

  if (alreadyPlaying()) {
    done("You already have progress here, so nothing was changed.", 2600);
    return;
  }

  /* Written raw on purpose. The game validates and repairs both saves on
     the way in — a bad board is re-dealt, a bad wallet is mended field by
     field — so this page does not need to know their shape, and cannot
     invent a second opinion about it. */
  async function apply(text) {
    var save = await unpack((text || "").trim());
    if (!save || (!save.c && !save.p)) throw new Error("nothing in it");
    if (save.c) localStorage.setItem("fives.campaign.v1", JSON.stringify(save.c));
    if (save.p) localStorage.setItem("fives.play.v2", JSON.stringify(save.p));
    var keys = (save.c && Number(save.c.keys)) || 0;
    done(keys ? "Your progress came with you, keys and all." : "Your progress came with you.", 1400);
  }

  var payload = location.hash.slice(1);

  /* ---- the paste route: the one that has to work ----
     An installed iOS app cannot be reached by a link and does not share
     storage with Safari, so this is how somebody on a home screen gets
     their save across. They arrive here from the picker footer. */
  function offerPaste(message) {
    head.textContent = "Coming from the old Fives?";
    sub.textContent = message;
    var box = document.getElementById("pastebox");
    var blob = document.getElementById("blob");
    var pasteBtn = document.getElementById("paste");
    var useBtn = document.getElementById("use");
    box.className = "";
    /* Pasting is the action on this screen. Play is the way out for someone
       who does not want to, so it goes quiet — one lime thing at a time. */
    document.getElementById("go").className = "go quiet";
    document.getElementById("go").textContent = "Skip, start fresh";

    function tryText(text) {
      apply(text).catch(function () {
        sub.textContent = "That does not look like a Fives save. Try copying it again.";
      });
    }

    /* Only attempt something that is actually shaped like a save. Without
       this gate, typing or a half-finished paste fires the error on every
       keystroke. */
    function looksLikeSave(t) {
      t = (t || "").trim();
      return t.indexOf("z1.") === 0 || t.indexOf("s1.") === 0;
    }

    function manual(message) {
      sub.textContent = message;
      /* ⚠ Do NOT focus the box here. On iOS a programmatic focus opens the
         keyboard and scrolls the page before the person has decided to do
         anything, and the buttons go off screen. Let them tap it. */
    }

    pasteBtn.addEventListener("click", function () {
      /* ⚠ iOS shows an Allow prompt before any page may read the clipboard,
         and often refuses outright inside an installed app. That extra tap
         cannot be designed away — the unlock flow hit the same wall. The box
         below is already on screen, so a refusal costs nothing. */
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(tryText, function () {
          manual("Tap the box, hold, and choose Paste.");
        });
      } else {
        manual("Tap the box, hold, and choose Paste.");
      }
    });

    /* The paste itself is the confirmation. Nobody should have to paste and
       then press a second button to mean it. "Use this" only appears if
       something lands in the box that we did not recognise, so the normal
       path is one action and the screen stays short. */
    function settle() {
      if (looksLikeSave(blob.value)) { tryText(blob.value); return; }
      if (blob.value.trim()) useBtn.className = "quiet";
    }
    /* On paste the value is not set until after the event, hence the tick. */
    blob.addEventListener("paste", function () { setTimeout(settle, 0); });
    blob.addEventListener("input", settle);

    useBtn.addEventListener("click", function () { tryText(blob.value); });
  }

  if (!payload) {
    offerPaste("Paste the progress you copied from the old address.");
    return;
  }

  /* ---- the link route: kept because it is seamless in a browser ---- */
  (async function () {
    try {
      await apply(payload);
    } catch (e) {
      /* A mangled link must not strand anybody. Fall back to the paste box
         rather than dumping them into a fresh game with no explanation. */
      offerPaste("That link could not be read. Paste your progress instead.");
    }
  })();
})();
</script>
</body>
</html>
